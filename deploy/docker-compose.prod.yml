# الإنتاج: VPS واحد + PostgreSQL مُدارة + Caddy
# التشغيل من جذر المستودع: docker compose -f deploy/docker-compose.prod.yml up -d
# المتغيرات في deploy/.env.production (غير متتبَّع في Git)
name: maquaty

services:
  api:
    image: ghcr.io/${GHCR_OWNER}/maquaty-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  worker:
    image: ghcr.io/${GHCR_OWNER}/maquaty-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['node', 'dist/worker-standby.js']
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  admin-portal:
    image: ghcr.io/${GHCR_OWNER}/maquaty-admin-portal:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../website:/srv/website:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin-portal
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  caddy_data:
  caddy_config:
